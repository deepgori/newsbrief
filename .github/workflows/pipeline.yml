name: News pipeline

on:
  schedule:
    # Every 10 minutes. GitHub's scheduler is best-effort, so runs can start a
    # few minutes late. The 8am Sydney briefing needs no separate cron:
    # digest.ts publishes it on the first run at/after 8am Sydney (DST-aware).
    - cron: "*/10 * * * *"
  push:
    # Code changes redeploy the site straight away. The bot's own data commits
    # are excluded so they don't trigger extra runs.
    branches: [main]
    paths-ignore: ["data/**"]
  workflow_dispatch:
    inputs:
      force_digest:
        description: "Publish (and email, if configured) the briefing now, ignoring the time and already-done check"
        type: boolean
        default: false

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Not a secret: identifies the Netlify site to deploy to.
  NETLIFY_SITE_ID: 1eceb16e-d498-4974-b171-a4383e9000aa

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Restoring node_modules takes seconds; `npm ci` takes ~50s.
      - id: deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            pipeline/node_modules
            web/node_modules
          key: deps-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci

      - name: Ingest and summarise new articles
        # A failed ingest must not block the briefing or deploy; they use what's stored.
        continue-on-error: true
        run: npm run ingest
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}

      - name: Publish 8am briefing (emails it too if Gmail secrets are set)
        run: npm run digest -- ${{ inputs.force_digest && '--force' || '' }}
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_RECIPIENTS: ${{ secrets.DIGEST_RECIPIENTS }}
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Commit data
        id: commit
        run: |
          git config user.name "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new data."
            exit 0
          fi
          git commit -q -m "data: update $(date -u +%FT%TZ)"
          git pull -q --rebase && git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # The site is built here and uploaded to Netlify directly, so Netlify's
      # 300 free build minutes/month aren't used.
      - name: Check for Netlify token
        id: netlify
        env:
          TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: echo "ready=$([ -n "$TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Build site
        if: steps.netlify.outputs.ready == 'true' && (steps.commit.outputs.changed == 'true' || github.event_name != 'schedule')
        run: npm run build:web

      - name: Deploy to Netlify
        if: steps.netlify.outputs.ready == 'true' && (steps.commit.outputs.changed == 'true' || github.event_name != 'schedule')
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          (cd web/out && zip -qr "$RUNNER_TEMP/site.zip" .)
          curl -sSf -X POST \
            -H "Content-Type: application/zip" \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            --data-binary "@$RUNNER_TEMP/site.zip" \
            "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/deploys" \
            | jq -r '"Netlify deploy \(.id): \(.state)"'
